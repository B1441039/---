        options: [
          { text: "熱鬧非凡、隨時都有營火與歡樂慶典的溫馨星系", scores: { dog: 2, otter: 1 } },
          { text: "籠罩在淡紫色極光下、靜謐而優雅的漂浮之城", scores: { cat: 2, fox: 1 } },
          { text: "運轉精準如齒輪、藏有無盡知識庫的高科技星宿", scores: { owl: 2, cat: 1 } },
          { text: "氣候變化莫測、充滿未知生態與奇幻地貌的探險秘境", scores: { fox: 2, otter: 1 } }
        ]
      }
    ];

    // 主應用程式物件
    class QuizApp {
      constructor() {
        this.currentIndex = 0;
        this.userAnswers = []; // 紀錄每題選擇的選項索引
        this.chartInstance = null;
        this.currentResult = null;
      }

      startQuiz() {
        document.getElementById('screen-welcome').classList.add('hidden');
        document.getElementById('screen-quiz').classList.remove('hidden');
        this.currentIndex = 0;
        this.userAnswers = [];
        this.renderQuestion();
      }

      renderQuestion() {
        const qData = QUESTIONS[this.currentIndex];
        const progressPercent = ((this.currentIndex + 1) / QUESTIONS.length) * 100;
        
        document.getElementById('quiz-progress-text').innerText = `${this.currentIndex + 1} / ${QUESTIONS.length}`;
        document.getElementById('quiz-progress-bar').style.width = `${progressPercent}%`;
        document.getElementById('question-text').innerText = qData.q;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        qData.options.forEach((opt, index) => {
          const btn = document.createElement('button');
          btn.className = "w-full text-left p-4 rounded-2xl bg-stone-50 hover:bg-amber-50 active:scale-[0.99] border border-stone-100 hover:border-amber-200 transition-all text-xs sm:text-sm font-medium text-darkslate leading-relaxed";
          btn.innerText = opt.text;
          btn.onclick = () => this.selectOption(index);
          optionsContainer.appendChild(btn);
        });

        // 第一題時隱藏上一題按鈕
        const prevBtn = document.getElementById('btn-prev');
        if (this.currentIndex === 0) {
          prevBtn.classList.add('invisible');
        } else {
          prevBtn.classList.remove('invisible');
        }

        // 動畫切換
        const qContainer = document.getElementById('question-container');
        qContainer.classList.remove('fade-enter');
        void qContainer.offsetWidth; // trigger reflow
        qContainer.classList.add('fade-enter');
      }

      selectOption(optionIndex) {
        this.userAnswers[this.currentIndex] = optionIndex;

        if (this.currentIndex < QUESTIONS.length - 1) {
          this.currentIndex++;
          this.renderQuestion();
        } else {
          this.calculateAndShowResult();
        }
      }

      prevQuestion() {
        if (this.currentIndex > 0) {
          this.currentIndex--;
          this.renderQuestion();
        }
      }

      calculateAndShowResult() {
        document.getElementById('screen-quiz').classList.add('hidden');
        document.getElementById('screen-loading').classList.remove('hidden');

        // 計分累計
        const scoreBoard = { dog: 0, cat: 0, owl: 0, otter: 0, fox: 0, sloth: 0 };
        this.userAnswers.forEach((optIdx, qIdx) => {
          const opt = QUESTIONS[qIdx].options[optIdx];
          for (let [animal, score] of Object.entries(opt.scores)) {
            scoreBoard[animal] = (scoreBoard[animal] || 0) + score;
          }
        });

        // 判定最高分動物
        let highestAnimal = 'dog';
        let highestScore = -1;
        for (let [animal, score] of Object.entries(scoreBoard)) {
          if (score > highestScore) {
            highestScore = score;
            highestAnimal = animal;
          }
        }

        this.currentResult = ANIMAL_PROFILES[highestAnimal];

        // 模擬 1.2 秒過渡載入效果
        setTimeout(() => {
          document.getElementById('screen-loading').classList.add('hidden');
          document.getElementById('screen-result').classList.remove('hidden');
          this.renderResultCard(this.currentResult);
        }, 1200);
      }

      renderResultCard(profile) {
        document.getElementById('result-icon').innerText = profile.icon;
        document.getElementById('result-icon-bg').style.backgroundColor = profile.color;
        document.getElementById('result-title').innerText = `${profile.subtitle}｜${profile.name}`;
        
        // 渲染標籤
        const tagsContainer = document.getElementById('result-tags');
        tagsContainer.innerHTML = '';
        profile.tags.forEach(t => {
          const tagSpan = document.createElement('span');
          tagSpan.className = "text-[11px] font-bold px-2.5 py-1 rounded-full bg-stone-100 text-stone-600";
          tagSpan.innerText = t;
          tagsContainer.appendChild(tagSpan);
        });

        // 渲染文案
        document.getElementById('result-strength').innerText = profile.strength;
        document.getElementById('result-blindspot').innerText = profile.blindspot;
        document.getElementById('result-match').innerText = profile.match;
        document.getElementById('result-match-desc').innerText = profile.matchDesc;
        document.getElementById('result-clash').innerText = profile.clash;
        document.getElementById('result-clash-desc').innerText = profile.clashDesc;

        // 渲染雷達圖
        this.renderRadarChart(profile);
      }

      renderRadarChart(profile) {
        const ctx = document.getElementById('radarChart').getContext('2d');
        if (this.chartInstance) {
          this.chartInstance.destroy();
        }

        this.chartInstance = new Chart(ctx, {
          type: 'radar',
          data: {
            labels: ['社交能量', '邏輯分析', '冒險創新', '溫暖同理', '獨立自律'],
            datasets: [{
              data: profile.stats,
              backgroundColor: profile.chartColor,
              borderColor: '#2D3142',
              borderWidth: 1.5,
              pointBackgroundColor: '#2D3142',
              pointRadius: 2.5
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              r: {
                angleLines: { color: 'rgba(0, 0, 0, 0.06)' },
                grid: { color: 'rgba(0, 0, 0, 0.06)' },
                pointLabels: {
                  font: {
                    family: '"Zen Maru Gothic", sans-serif',
                    size: 10,
                    weight: '500'
                  },
                  color: '#666'
                },
                suggestedMin: 20,
                suggestedMax: 100,
                ticks: { display: false }
              }
            },
            plugins: {
              legend: { display: false }
            }
          }
        });
      }

      downloadImage() {
        const target = document.getElementById('result-card');
        const originalShadow = target.style.boxShadow;
        target.style.boxShadow = 'none';

        html2canvas(target, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#FFFFFF'
        }).then(canvas => {
          target.style.boxShadow = originalShadow;
          const link = document.createElement('a');
          link.download = `animal-quiz-${this.currentResult.id}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      }

      copyResult() {
        if (!this.currentResult) return;
        const text = `我在【動物系性格測驗】測出的是：${this.currentResult.subtitle}｜${this.currentResult.name}！\n最契合的夥伴是：${this.currentResult.match}\n快來測測看你的動物靈魂原型吧！`;
        
        navigator.clipboard.writeText(text).then(() => {
          const toast = document.getElementById('toast');
          toast.classList.remove('opacity-0');
          setTimeout(() => toast.classList.add('opacity-0'), 2000);
        });
      }

      restart() {
        document.getElementById('screen-result').classList.add('hidden');
        document.getElementById('screen-welcome').classList.remove('hidden');
      }
    }

    const quizApp = new QuizApp();
  </script>
</body>
</html>
